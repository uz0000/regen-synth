[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regen-synth"
version = "0.1.0"
description = "Does synthetic data preserve the conclusion? A generator, an independent certifier, and the finding that neither this generator nor its competitors pass."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "REGEN Contributors"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "GPy",
    "matplotlib",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
]
pfn = [
    "tabpfn>=2.0,<3.0",
    "torch",
    "torch-geometric",
]
all = [
    "regen-synth[dev,pfn]",
]

[project.urls]
Homepage = "https://github.com/uz0000/regen-synth"
Documentation = "https://github.com/uz0000/regen-synth/tree/main/docs"

[project.scripts]
regen = "cli.main:main"

[tool.setuptools.packages.find]
include = ["engine*", "contracts*", "cli*", "regen*", "server*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Silence the thousands of GPy/paramz DeprecationWarnings ("Assigning the 'data'
# attribute is an inherently unsafe operation") that otherwise bury real warnings
# in the test output. Third-party internals — not our code. Ours are untouched.
filterwarnings = [
    "ignore:Assigning the 'data' attribute is an inherently unsafe operation:DeprecationWarning",
]
